<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PassionVerse — Connect Through Passion</title>
  <desc id="desc">A vibrant purple and coral banner for PassionVerse with hobby tags, friendly community cards, and the tagline Connect Through Passion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="10" x2="1434" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211337"/>
      <stop offset=".48" stop-color="#321943"/>
      <stop offset="1" stop-color="#521D4A"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(309 246 -234 294 1167 201)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185" stop-opacity=".37"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FBCFE8" fill-opacity=".19"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#10091B" flood-opacity=".32"/>
    </filter>
  </defs>
